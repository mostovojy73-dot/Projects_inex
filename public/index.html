<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Объекты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#17181b;--panel:#212227;--panel2:#2a2b31;--line:#3b3d45;--tx:#f3f4f6;--mut:#a4a8b1;--acc:#f1532b;--acc2:#ff7a45;--ok:#3fb27f;--bad:#e5484d;--ink:#17181b;--concrete:#17181b;--paper:#212227;--yellow:#f1532b}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#24252b 0%,var(--bg) 70%) fixed;color:var(--tx);font:300 17px/1.5 Jost,"Futura PT",Futura,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{padding:calc(16px + env(safe-area-inset-top)) 18px 0}
.brand{display:flex;align-items:center;gap:10px;color:var(--acc);font:400 22px/1 Jost,sans-serif;letter-spacing:.4px}
h1{margin:20px 0 14px;font:400 30px/1.1 Jost,sans-serif;text-transform:uppercase;letter-spacing:.5px}
h1 em{font-style:normal;color:var(--acc)}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 16px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.plate{flex:none;max-width:70vw;padding:9px 16px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--tx);font:400 17px/1.1 Jost,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.on{border-color:var(--acc);color:var(--acc)}
.plate.add{border-style:dashed;color:var(--mut)}
.stripe{height:1px;background:#6f7886;margin:0 18px}
main{max-width:640px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--panel);border-radius:4px;padding:16px;margin-bottom:12px;box-shadow:0 14px 30px -16px rgba(0,0,0,.7)}
h2{margin:22px 4px 10px;font:400 24px/1.1 Jost,sans-serif;text-transform:uppercase;color:var(--tx)}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:16px;color:var(--tx)}
.pill:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--mut))}
.addr{color:var(--mut);margin:4px 0 10px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.kv span:first-child{color:var(--mut);flex:none;max-width:45%}.kv span:last-child{text-align:right;word-break:break-word}
.doc{border-left:3px solid var(--acc)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dt{font-weight:500;font-size:19px;color:var(--acc);word-break:break-word}
.ver{flex:none;padding:1px 9px;border:1px solid var(--acc);border-radius:3px;color:var(--acc);font:500 15px Jost,sans-serif}
.meta{color:var(--mut);font-size:15px}.note{margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit}
.b{padding:10px 18px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--tx);font:500 14px Jost,sans-serif;text-transform:uppercase;letter-spacing:.6px}
.b.main{border-color:var(--acc);color:var(--tx)}.b.main:active{background:var(--acc)}.b.sm{padding:7px 12px;font-size:13px}
.hist{margin-top:14px;border-top:1px solid var(--line)}
.old{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.old:last-child{border:0}
.old .dt{font-size:17px;color:var(--tx)}
.tag{font-size:14px;color:var(--mut)}
.msg{text-align:center;color:var(--mut);padding:24px 10px}
.sheet{position:fixed;inset:0;background:rgba(8,9,11,.7);display:flex;align-items:flex-end;z-index:5}
.sheet form{width:100%;max-width:640px;margin:0 auto;background:var(--panel);border-top:2px solid var(--acc);border-radius:6px 6px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 4px;font:400 24px Jost,sans-serif;text-transform:uppercase}
label{display:block;margin:14px 0 5px;font-size:15px;color:var(--mut)}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:3px;font:400 17px Jost,sans-serif;background:var(--bg);color:var(--tx)}
input::placeholder{color:#6d717a}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--tx);padding:10px 16px;border-radius:3px;z-index:9;max-width:90vw}
.hide{display:none}
@media(min-width:900px){main{max-width:860px}header{padding-left:max(18px,calc(50% - 430px));padding-right:18px}.stripe{margin:0 max(18px,calc(50% - 430px))}}
</style></head><body>
<header><div class="brand"><svg width="38" height="38" viewBox="0 0 40 40" fill="none" stroke="#f1532b" stroke-width="1.4" aria-hidden="true"><path d="M1 11V1h10M29 1h10v10M1 29v10h10M29 39h10V29"/><g stroke="none" fill="#f1532b" font-family="Jost,sans-serif" font-size="10"><text x="8" y="17">I</text><text x="24" y="17">N</text><text x="8" y="33">E</text><text x="24" y="33">X</text></g></svg><span>TECHNOLOGY</span></div>
<h1>Объекты <em>INEX</em></h1><nav id="tabs"></nav></header><div class="stripe"></div>
<main id="view"><div class="msg">Загрузка…</div></main>
<div id="sheet" class="sheet hide"></div><div id="toast" class="toast hide"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#17181b");tg.setBackgroundColor("#17181b")}catch(e){}}
const $=id=>document.getElementById(id);
// В веб-версии Telegram страница открыта во вложенном окне, и браузер может запретить localStorage: без защиты приложение зависало на «Загрузка…»
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let D={objects:[],info:[],docs:[],role:"viewer"},cur=store.get("obj")||"",open=new Set();
const isOwner=()=>D.role==="owner";
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fdate=s=>/^\d{4}-\d\d-\d\d$/.test(s)?s.slice(8)+"."+s.slice(5,7)+"."+s.slice(0,4):s;
const same=(a,b)=>String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
function toast(t){const x=$("toast");x.textContent=t;x.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add("hide"),2600)}

async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json","Authorization":tg&&tg.initData?"tma "+tg.initData:"Bearer "+(store.get("tok")||""),...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"error"),{status:r.status,body:j});return j;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});
async function load(){
  try{D=await api("/api/data");if(!D.objects.some(o=>same(o.name,cur)))cur=D.objects[0]?.name||"";render()}
  catch(e){const v=$("view");v.textContent="";const m=el("div","msg");
    if(e.status===401&&!(tg&&tg.initData))return showLogin();
    m.textContent=e.status===403?"Нет доступа. Ваш Telegram ID: "+e.body.id+". Отправьте его администратору.":e.status===401?"Откройте приложение через кнопку «Объекты» в Telegram-боте.":"Не удалось загрузить данные. Попробуйте ещё раз.";v.appendChild(m)}
}

// Вход с компьютера и из браузера: официальная кнопка «Войти через Telegram»
async function showLogin(){
  const v=$("view");v.textContent="";const m=el("div","msg","Войдите через Telegram, чтобы открыть объекты");v.appendChild(m);
  try{const {bot}=await api("/api/config");if(!bot)throw 0;
    window.onTg=async u=>{try{const r=await post("/api/login",u);store.set("tok",r.token);load()}catch(e){toast("Не удалось войти")}};
    const s=document.createElement("script");s.async=true;s.src="https://telegram.org/js/telegram-widget.js?22";
    s.dataset.telegramLogin=bot;s.dataset.size="large";s.dataset.radius="10";s.dataset.onauth="onTg(user)";m.appendChild(el("div")).appendChild(s)}
  catch(e){m.textContent="Не удалось подготовить вход. Откройте приложение через бота в Telegram."}
}
// форма внизу экрана: fields = [{k,label,ph,list,val,req}]
function ask(title,fields,send){
  const s=$("sheet");s.textContent="";s.classList.remove("hide");
  const f=el("form");f.appendChild(el("h3","",title));const inp={};
  fields.forEach(x=>{f.appendChild(el("label","",x.label));const i=el("input");i.placeholder=x.ph||"";i.value=x.val||"";i.required=!!x.req;i.maxLength=x.max||300;
    if(x.list){const id="dl"+x.k;i.setAttribute("list",id);const dl=el("datalist");dl.id=id;x.list.forEach(v=>{const o=el("option");o.value=v;dl.appendChild(o)});f.appendChild(dl)}
    inp[x.k]=i;f.appendChild(i)});
  const row=el("div","btns"),ok=el("button","b main","Сохранить"),no=el("button","b","Отмена");ok.type="submit";no.type="button";
  no.onclick=()=>s.classList.add("hide");row.append(ok,no);f.appendChild(row);s.appendChild(f);
  f.onsubmit=async e=>{e.preventDefault();ok.disabled=true;const v={};for(const k in inp)v[k]=inp[k].value.trim();
    try{await send(v);s.classList.add("hide");toast("Сохранено");await load()}catch(er){ok.disabled=false;toast(er.message==="exists"?"Такой объект уже есть":"Не удалось сохранить")}};
  (Object.values(inp).find(i=>!i.value)||Object.values(inp)[0]).focus();
}
async function dl(d){
  try{const {url}=await api("/api/link/"+d.id);const u=location.origin+url;tg&&tg.openLink?tg.openLink(u):window.open(u,"_blank")}
  catch(e){toast("Не удалось получить файл")}
}
const statusColor=s=>/работ|идёт|идет/i.test(s)?"var(--ok)":/пауз|стоп|заморож/i.test(s)?"var(--bad)":"var(--mut)";

function render(){
  const T=$("tabs");T.textContent="";
  D.objects.forEach(o=>{const b=el("button","plate"+(same(o.name,cur)?" on":""),o.name);b.onclick=()=>{cur=o.name;store.set("obj",cur);render()};T.appendChild(b)});
  if(isOwner()){const b=el("button","plate add","+ Объект");b.onclick=()=>ask("Новый объект",[{k:"name",label:"Название",ph:"Например: ЖК Северный, корпус 2",req:1,max:80},{k:"addr",label:"Адрес",max:200},{k:"status",label:"Статус",val:"В работе",list:["В работе","Приостановлен","Сдан"],max:40}],v=>post("/api/object",v));T.appendChild(b)}
  const V=$("view");V.textContent="";
  const o=D.objects.find(x=>same(x.name,cur));
  if(!o){V.appendChild(el("div","msg",isOwner()?"Объектов пока нет. Нажмите «+ Объект», чтобы добавить первый.":"Объектов пока нет."));return}

  const c=el("div","card"),p=el("div","pill",o.status||"Без статуса");p.style.setProperty("--c",statusColor(o.status));c.appendChild(p);
  if(o.addr)c.appendChild(el("div","addr",o.addr));
  D.info.filter(i=>same(i.obj,o.name)).forEach(i=>{const r=el("div","kv");r.append(el("span","",i.key),el("span","",i.val));c.appendChild(r)});
  if(isOwner()){const b=el("button","b sm","Добавить или изменить поле");b.style.marginTop="10px";
    b.onclick=()=>ask("Информация по объекту",[{k:"key",label:"Поле",ph:"Прораб, телефон, заказчик, срок сдачи…",req:1,list:[...new Set(D.info.map(i=>i.key))],max:60},{k:"val",label:"Значение",max:500}],v=>post("/api/info",{obj:o.name,...v}));c.appendChild(b)}
  V.appendChild(c);

  // документы: группируем по разделу и названию, свежая версия сверху, старые в «Истории»
  const docs=D.docs.filter(d=>same(d.obj,o.name)),secs=[];
  docs.forEach(d=>{if(!secs.includes(d.section))secs.push(d.section)});
  const addDoc=(title,section)=>ask(title?"Новая версия: "+title:"Новый документ",[
    ...(title?[]:[{k:"title",label:"Название документа",ph:"Например: План 2 этажа",req:1,max:120},{k:"section",label:"Раздел",val:section||"",list:[...new Set(["Чертежи","Сметы","Договоры","Акты","Фото",...secs])],max:40}]),
    {k:"url",label:"Ссылка на файл (Google Диск или Яндекс Диск)",ph:"https://",req:1,max:1000},{k:"note",label:"Что изменилось (необязательно)",max:300}],
    v=>post("/api/doc",{obj:o.name,title,section,...v}));
  const hd=el("div");hd.style.cssText="display:flex;justify-content:space-between;align-items:baseline";
  hd.appendChild(el("h2","","Документы"));
  if(isOwner()){const b=el("button","b sm","+ Документ");b.onclick=()=>addDoc();hd.appendChild(b)}V.appendChild(hd);
  if(!docs.length)V.appendChild(el("div","msg",isOwner()?"Здесь пока нет документов. Добавьте ссылку на файл кнопкой «+ Документ».":"Документов пока нет."));
  secs.forEach(sec=>{
    V.appendChild(el("h2","",sec)).style.fontSize="18px";
    const groups={};docs.filter(d=>d.section===sec).forEach(d=>(groups[d.title.toLowerCase()]||=[]).push(d));
    Object.values(groups).forEach(g=>{
      g.sort((a,b)=>b.ver-a.ver);const [last,...old]=g,k=o.name+"|"+last.title.toLowerCase();
      const card=el("div","card doc"),h=el("div","dh");h.append(el("div","dt",last.title),el("div","ver","v"+last.ver));card.appendChild(h);
      card.appendChild(el("div","meta","Загружено "+fdate(last.date)+(last.who?", "+last.who:"")));
      if(last.note)card.appendChild(el("div","note",last.note));
      const bs=el("div","btns"),d1=el("button","b main","Скачать");d1.onclick=()=>dl(last);bs.appendChild(d1);
      if(old.length){const hb=el("button","b",(open.has(k)?"Скрыть историю":"История")+" ("+old.length+")");hb.onclick=()=>{open.has(k)?open.delete(k):open.add(k);render()};bs.appendChild(hb)}
      if(isOwner()){const nb=el("button","b","Новая версия");nb.onclick=()=>addDoc(last.title,last.section);bs.appendChild(nb)}
      card.appendChild(bs);
      if(old.length&&open.has(k)){const hs=el("div","hist");old.forEach((d,i)=>{
        const r=el("div","old"),l=el("div");l.appendChild(el("div","dt","Версия "+d.ver+" от "+fdate(d.date)));
        l.appendChild(el("div","tag","Заменена версией "+(i?old[i-1].ver:last.ver)+" от "+fdate((i?old[i-1]:last).date)+(d.note?". "+d.note:"")));
        const b=el("button","b sm","Скачать");b.onclick=()=>dl(d);r.append(l,b);hs.appendChild(r)});card.appendChild(hs)}
      V.appendChild(card);
    });
  });
}
load();
</script></body></html>
